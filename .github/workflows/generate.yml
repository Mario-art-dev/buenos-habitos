name: Generar short

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo"
        required: true
        type: choice
        options:
          - SINGLE
          - RANKING
          - PRODUCT
          - SONG
        default: SINGLE
      sourceUrl:
        description: "URL del vídeo (SINGLE, RANKING y SONG)"
        required: false
        type: string
      songUrl:
        description: "URL de YouTube de la canción (solo SONG)"
        required: false
        type: string
      productName:
        description: "Nombre del producto (solo PRODUCT)"
        required: false
        type: string
      productLink:
        description: "Enlace del producto/afiliado (solo PRODUCT; también se usa para sacar fotos si no das productImageUrls)"
        required: false
        type: string
      referenceAdUrl:
        description: "Anuncio existente de referencia, opcional (solo PRODUCT)"
        required: false
        type: string
      productImageUrls:
        description: "URLs de fotos/vídeos del producto, una por línea (solo PRODUCT)"
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar ffmpeg, yt-dlp y dependencias de Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip fonts-dejavu-core
          pip3 install --no-cache-dir --break-system-packages yt-dlp faster-whisper piper-tts librosa bgutil-ytdlp-pot-provider yt-dlp-invidious

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Iniciar el proveedor de tokens de YouTube (evita el bloqueo por IP de datacenter)
        run: |
          docker pull brainicism/bgutil-ytdlp-pot-provider
          docker run -d --init -p 4416:4416 --name bgutil-provider brainicism/bgutil-ytdlp-pot-provider
          ready=""
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:4416; then
              ready=1
              echo "Proveedor de tokens listo."
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "El proveedor de tokens no respondió a tiempo. Logs del contenedor:"
            docker logs bgutil-provider || true
            exit 1
          fi

      - name: Preparar la base de datos local
        run: npx prisma generate && npx prisma db push
        env:
          DATABASE_URL: "file:./storage/app.db"

      - name: Generar el short
        run: npx tsx scripts/run_job_cli.ts
        env:
          DATABASE_URL: "file:./storage/app.db"
          JOB_MODE: ${{ inputs.mode }}
          SOURCE_URL: ${{ inputs.sourceUrl }}
          SONG_URL: ${{ inputs.songUrl }}
          PRODUCT_NAME: ${{ inputs.productName }}
          PRODUCT_LINK: ${{ inputs.productLink }}
          REFERENCE_AD_URL: ${{ inputs.referenceAdUrl }}
          PRODUCT_IMAGE_URLS: ${{ inputs.productImageUrls }}
          AI_PROVIDER: "groq"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSCRIPTION_PROVIDER: "local"
          PYTHON_PATH: "python3"
          TTS_PROVIDER: "local"
          ENABLE_COMMENTARY: "false"
          ENABLE_SUBTITLES: "true"
          ENABLE_DYNAMIC_ZOOM: "true"
          CHANNEL_NAME: "Escenas Virales"
          CHANNEL_NICHE: "Recopilación de los momentos más divertidos, graciosos y de entretenimiento de creadores de contenido — humor, giros inesperados y reacciones, pensado para el público de comedia/entretenimiento de shorts"
          # Sin fijar CHANNEL_LANGUAGE aquí: se usa el valor por defecto de la app (inglés,
          # más ingresos publicitarios). Antes esto estaba fijado a "es" y anulaba en silencio
          # ese valor por defecto en todo momento.
          TZ: "Europe/Madrid"

      - name: Subir el resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: output/
          retention-days: 14
          if-no-files-found: warn
