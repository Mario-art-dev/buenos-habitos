          path: storage/app.db
          key: escenas-db-${{ github.run_id }}-4

      - name: Mantener la sesión activa (checkpoint 5/33 de la galería)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 600
          gh cache delete "escenas-storage-${{ github.run_id }}-4" || true
          gh cache delete "escenas-db-${{ github.run_id }}-4" || true

