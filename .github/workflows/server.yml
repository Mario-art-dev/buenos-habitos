          gh cache delete "escenas-storage-${{ github.run_id }}-14" || true
          gh cache delete "escenas-db-${{ github.run_id }}-14" || true

      - name: Guardar la galería (checkpoint 15/33)
        uses: actions/cache/save@v4
        with:
