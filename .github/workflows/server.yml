name: Servidor temporal

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: escenas-server
  cancel-in-progress: false

jobs:
  server:
    if: ${{ vars.SERVER_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Restaurar la galería de la sesión anterior
        # "restore" (no "actions/cache@v4" a secas): solo queremos RECUPERAR el último checkpoint
        # guardado por la sesión anterior, nunca que este paso guarde uno nuevo por su cuenta al
        # terminar el job — ya hay guardado explícito propio más abajo (uno por checkpoint, con
        # limpieza del anterior). Con "actions/cache@v4" normal, su propio guardado automático al
        # final (bajo la clave única de ESTE run, sin limpiar nunca) se quedaba huérfano para
        # siempre en cada sesión que terminaba bien — con el tiempo iba acumulando caché sin
        # límite y podía acabar desalojando (por el tope de 10GB del repo) el checkpoint de verdad
        # que hacía falta para recuperar la galería.
        #
        # Bug real confirmado (con logs reales, no adivinado): un checkpoint de ~12GB llegó a
        # guardarse bien (confirmado byte a byte) y a restaurarse bien en la sesión siguiente
        # (confirmado también), pero UNA sesión más tarde ya no quedaba NINGÚN checkpoint —
        # "Cache not found for input keys" total. GitHub Actions limita la caché a 10GB por
        # repositorio en total; un solo checkpoint de 12GB ya supera ese tope él solo, así que
        # tarde o temprano se desaloja ENTERO sin avisar, aunque el guardado en su momento
        # pareciera ir bien. Por eso la base de datos (unos pocos MB) va aparte, en su PROPIA
        # caché — así sobrevive aunque la de los vídeos (que sí puede crecer sin límite real) se
        # acabe desalojando por peso.
        uses: actions/cache/restore@v4
        with:
          path: storage
          key: escenas-storage-${{ github.run_id }}
          restore-keys: |
            escenas-storage-

      - name: Restaurar la base de datos por separado (nunca se desaloja por peso de los vídeos)
        uses: actions/cache/restore@v4
        with:
          path: storage/app.db
          key: escenas-db-${{ github.run_id }}
          restore-keys: |
            escenas-db-

      - name: Diagnóstico — comprobar que la base de datos restaurada existe de verdad
        # Deja constancia en el log de qué hay EXACTAMENTE en storage/ justo después de restaurar
        # (los dos pasos de arriba), para poder confirmar de un vistazo que esta vez sí ha llegado.
        run: |
          echo "--- contenido de storage/ ---"
          ls -la storage/ 2>&1 || echo "(storage/ no existe)"
          echo "--- buscando app.db en todo el árbol ---"
          find storage -maxdepth 3 -iname "app.db*" -exec ls -la {} \; 2>&1 || true
          echo "--- espacio en disco ---"
          df -h . || true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar ffmpeg, yt-dlp y dependencias de Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip fonts-dejavu-core fonts-liberation fonts-comic-neue
          pip3 install --no-cache-dir --break-system-packages yt-dlp faster-whisper piper-tts librosa bgutil-ytdlp-pot-provider yt-dlp-invidious

      - name: Instalar fuentes libres para el editor de texto del clip
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/custom
          # Google Fonts (licencia OFL/Apache), directo del repo oficial: no todas están
          # empaquetadas para apt. "%5B"/"%5D" son "[" "]" codificados porque curl interpreta
          # corchetes sin codificar como un rango/glob, no como parte literal de la URL.
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/BebasNeue-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/bebasneue/BebasNeue-Regular.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Anton-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Montserrat-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Poppins-Bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Oswald-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/oswald/Oswald%5Bwght%5D.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/PermanentMarker-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/apache/permanentmarker/PermanentMarker-Regular.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Bangers-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/bangers/Bangers-Regular.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Lobster-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/lobster/Lobster-Regular.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/ArchivoBlack-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/archivoblack/ArchivoBlack-Regular.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Caveat-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/caveat/Caveat%5Bwght%5D.ttf"
          sudo fc-cache -f

      - name: Instalar el modelo de IA local de repuesto (Ollama) — nunca bloquea el arranque
        # Último eslabón de la cadena de proveedores de IA (ver src/lib/ai/ollama.ts): un modelo
        # abierto corriendo en este mismo servidor, sin clave, sin cuenta, sin tarjeta, sin cupo
        # que se pueda agotar — solo se usa si todos los proveedores en la nube fallan a la vez.
        # continue-on-error de verdad: si algo aquí falla (red bloqueada, instalador caído, lo que
        # sea), la sesión sigue exactamente igual que sin este paso — nunca puede romper el
        # arranque de la web/worker. La descarga del modelo se lanza en segundo plano (no se
        # espera aquí) para no restar tiempo a los pasos siguientes; con el tiempo que tardan
        # (fuentes, npm ci, imagen de Docker, compilar) suele terminar de sobra antes de que haga
        # falta de verdad.
        continue-on-error: true
        run: |
          set +e
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:11434 && break
            sleep 1
          done
          nohup sh -c 'ollama pull llama3.2:3b; ollama pull moondream' > ollama-pull.log 2>&1 &
          exit 0

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Iniciar el proveedor de tokens de YouTube (evita el bloqueo por IP de datacenter)
        run: |
          docker pull brainicism/bgutil-ytdlp-pot-provider
          docker run -d --init -p 4416:4416 --name bgutil-provider brainicism/bgutil-ytdlp-pot-provider
          ready=""
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:4416; then
              ready=1
              echo "Proveedor de tokens listo."
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "El proveedor de tokens no respondió a tiempo. Logs del contenedor:"
            docker logs bgutil-provider || true
            exit 1
          fi

      - name: Preparar la base de datos (reutilizando la de la caché si existe)
        run: npx prisma generate && npx prisma db push
        env:
          DATABASE_URL: "file:./storage/app.db"

      - name: Compilar la web
        run: npm run build
        env:
          DATABASE_URL: "file:./storage/app.db"
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Arrancar la web y el worker en segundo plano
        run: |
          nohup npm run start > web.log 2>&1 &
          nohup npx tsx worker/index.ts > worker.log 2>&1 &
        env:
          DATABASE_URL: "file:./storage/app.db"
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          AI_PROVIDER: "groq"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Cadena de repuesto: si se ponen estos dos secretos (ambos con capa gratuita, ver
          # src/lib/ai/cerebras.ts y mistral.ts), se usan solos cuando Groq/Gemini se queden sin
          # cupo — no hace falta tocar nada más aquí, el orden lo decide FALLBACK_ORDER en
          # src/lib/ai/provider.ts.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # Último eslabón de repuesto: modelo local sin clave (ver el paso de arriba que lo
          # instala) — si por lo que sea no llegó a instalarse/descargarse a tiempo, una llamada
          # aquí simplemente falla y la cadena de proveedores sigue funcionando igual que sin él.
          OLLAMA_ENABLED: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Sin estos cuatro, config.google/config.tiktok se quedan vacíos y la web no puede
          # conectar YouTube/TikTok aunque el código de OAuth esté bien — hacían falta como
          # secretos de GitHub PERO nunca se pasaban aquí al proceso.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TRANSCRIPTION_PROVIDER: "local"
          PYTHON_PATH: "python3"
          TTS_PROVIDER: "local"
          ENABLE_COMMENTARY: "false"
          ENABLE_DYNAMIC_ZOOM: "true"
          ENABLE_HOOK_FRAME_CHECK: "true"
          ENABLE_BIG_CAPTIONS: "true"
          ENABLE_COVER_CARD: "true"
          CHANNEL_NAME: "Escenas Virales"
          CHANNEL_NICHE: "Recopilación de los momentos más divertidos, graciosos y de entretenimiento de creadores de contenido — humor, giros inesperados y reacciones, pensado para el público de comedia/entretenimiento de shorts"
          # Sin fijar CHANNEL_LANGUAGE aquí: se usa el valor por defecto de la app (inglés,
          # más ingresos publicitarios). Antes esto estaba fijado a "es" y anulaba en silencio
          # ese valor por defecto en todo momento.
          # La programación automática (franjas horarias) necesita saber la zona horaria real
          # para que "12:00-14:00" signifique la hora de España y no UTC.
          TZ: "Europe/Madrid"

      - name: Esperar a que la web responda
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000; then
              echo "Web lista."
              exit 0
            fi
            sleep 2
          done
          echo "La web no arrancó a tiempo, revisa web.log"
          cat web.log
          exit 1

      - name: Abrir el túnel público (Cloudflare, sin cuenta)
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:3000 > cloudflared.log 2>&1 &

          URL=""
          for i in $(seq 1 20); do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' cloudflared.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "No se pudo abrir el túnel."
            cat cloudflared.log
            exit 1
          fi

          echo "## 🔗 Tu panel está listo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**$URL**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Entra con la contraseña que pusiste en el secreto \`APP_PASSWORD\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Esta URL cambiará dentro de ~5h30min, cuando esta sesión pase el testigo a la siguiente." >> "$GITHUB_STEP_SUMMARY"
          echo "[cloudflared] URL pública: $URL"

      # El guardado automático de la galería (paso "Post Restaurar...") ya NO existe (ver el paso
      # de arriba, que usa "restore" en vez de "cache@v4" a secas) — el ÚNICO guardado real pasa
      # por aquí: un snapshot manual cada 10 minutos, cada uno borrando el anterior nada más
      # guardar el siguiente. Así, tanto si el job termina limpio como si se CANCELA a mitad de
      # sesión (p.ej. al reiniciar el servidor manualmente tras subir código nuevo) o se cae por
      # cualquier otro motivo, como mucho se pierden los últimos 10 min de shorts generados en vez
      # de la sesión entera (~5h30min).
      #
      # Cada checkpoint guarda DOS cachés independientes: la de siempre (todo storage/, incluidos
      # los vídeos — puede pesar varios GB y con el tiempo puede acabar desalojada por el tope de
      # 10GB del repositorio, confirmado con un caso real) y una aparte solo para storage/app.db
      # (unos pocos MB, prácticamente nunca en riesgo de desalojo) — así la base de datos (los
      # registros de cada short, lo que alimenta la galería) sobrevive aunque la de los vídeos se
      # llegue a perder por peso.
      - name: Mantener la sesión activa (checkpoint 1/33 de la galería)
        run: sleep 600

      - name: Guardar la galería (checkpoint 1/33)
        uses: actions/cache/save@v4
        with:
          path: storage
          key: escenas-storage-${{ github.run_id }}-1

      - name: Guardar la base de datos por separado (checkpoint 1/33)
        uses: actions/cache/save@v4
        with:
          path: storage/app.db
          key: escenas-db-${{ github.run_id }}-1

      - name: Mantener la sesión activa (checkpoint 2/33 de la galería)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 600
          gh cache delete "escenas-storage-${{ github.run_id }}-1" || true
          gh cache delete "escenas-db-${{ github.run_id }}-1" || true

      - name: Guardar la galería (checkpoint 2/33)
        uses: actions/cache/save@v4
        with:
          path: storage
          key: escenas-storage-${{ github.run_id }}-2

      - name: Guardar la base de datos por separado (checkpoint 2/33)
        uses: actions/cache/save@v4
        with:
          path: storage/app.db
          key: escenas-db-${{ github.run_id }}-2

      - name: Mantener la sesión activa (checkpoint 3/33 de la galería)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 600
          gh cache delete "escenas-storage-${{ github.run_id }}-2" || true
          gh cache delete "escenas-db-${{ github.run_id }}-2" || true

      - name: Guardar la galería (checkpoint 3/33)
        uses: actions/cache/save@v4
        with:
          path: storage
          key: escenas-storage-${{ github.run_id }}-3

      - name: Guardar la base de datos por separado (checkpoint 3/33)
        uses: actions/cache/save@v4
        with:
          path: storage/app.db
          key: escenas-db-${{ github.run_id }}-3

      - name: Mantener la sesión activa (checkpoint 4/33 de la galería)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 600
          gh cache delete "escenas-storage-${{ github.run_id }}-3" || true
          gh cache delete "escenas-db-${{ github.run_id }}-3" || true

      - name: Guardar la galería (checkpoint 4/33)
        uses: actions/cache/save@v4
        with:
          path: storage
          key: escenas-storage-${{ github.run_id }}-4

      - name: Guardar la base de datos por separado (checkpoint 4/33)
