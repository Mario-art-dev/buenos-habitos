name: Servidor temporal

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# El nombre del grupo se cambió de "escenas-server" a "escenas-server-v2" porque la sesión
# #110 se quedó fantasma en cola (bug real del lado de GitHub: ni la API, ni la propia web de
# GitHub, ni disable/enable del workflow consiguieron cancelarla — siempre 409 "not been queued
# yet" pese a figurar como "queued" sin ningún job asignado durante horas). Con "cancel-in-
# progress: false", esa sesión fantasma bloqueaba en fila a cualquier sesión nueva del mismo
# grupo para siempre. Cambiando el nombre del grupo, las sesiones nuevas quedan en un carril
# aparte y arrancan sin tener que esperar a que la fantasma se resuelva sola (se queda ahí
# colgada sin gastar ningún runner real, simplemente ignorada).
concurrency:
  group: escenas-server-v2
  cancel-in-progress: false

jobs:
  server:
    if: ${{ vars.SERVER_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Restaurar la galería desde el respaldo permanente (rama git "gallery-data")
        # POR QUÉ YA NO SE USA "actions/cache" PARA ESTO (aunque sea más rápido): confirmado con
        # logs reales, no adivinado, que la caché de GitHub Actions NUNCA fue almacenamiento
        # duradero de verdad, por mucho que se separara la base de datos de los vídeos (fix
        # anterior, insuficiente): tiene un tope de 10GB por repositorio con desalojo automático
        # (un solo checkpoint de ~12GB ya lo supera él solo y se acaba desalojando ENTERO sin
        # avisar) y además cada entrada caduca sola a los 7 días sin usarse, pase lo que pase con
        # el tamaño. Así se perdieron los ~40 shorts de la sesión temporal 89: cuando se
        # comprobó, la caché ya había desaparecido por completo ("Cache not found for input
        # keys" total) — y no hay forma de deshacer eso, la caché no guarda versiones.
        #
        # El arreglo de verdad: en vez de una caché de build (pensada para ser desechable),
        # storage/ (la base de datos Y los vídeos) se respalda en una rama de git normal
        # ("gallery-data") de este mismo repositorio, con un commit real por checkpoint. Una
        # rama de git NO caduca nunca y NO se desaloja por peso — es simplemente parte del
        # historial del repositorio hasta que alguien la borre a mano. Es el único mecanismo
        # gratuito (cero tarjeta, cero cuenta de pago) que da persistencia de verdad aquí.
        run: |
          set -e
          git config --global user.email "actions@github.com"
          git config --global user.name "Escenas Virales Bot"
          mkdir -p storage
          REMOTE_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # BUG REAL CONFIRMADO (con logs reales, no adivinado): el primer "timeout 120" era
          # demasiado corto para el tamaño real que ha alcanzado la rama de respaldo (varios GB de
          # vídeos) — el clon se mataba por tiempo (git solo llega a imprimir "Cloning into...",
          # sin ningún error de "rama no encontrada") y el script, incapaz de distinguir "se agotó
          # el tiempo" de "la rama no existe", tomaba el camino de "primera vez" y arrancaba con
          # storage/ VACÍO cada sesión — perdiendo en la práctica toda la galería y la cola de cada
          # sesión, aunque los datos siguieran ahí en la rama. Arreglo: más tiempo e intentos, y
          # solo se trata como "la rama no existe de verdad" el mensaje exacto de git para eso —
          # cualquier otro fallo (timeout, red) reintenta, y si los tres intentos fallan, el job
          # entero se para aquí (mejor una caída visible y clara que arrancar en silencio con la
          # galería vacía y sobrescribir sin darse cuenta el respaldo real en el primer checkpoint).
          ok=""
          not_found=""
          for attempt in 1 2 3; do
            timeout_s=$((attempt * 300))
            rm -rf /tmp/gallery-backup
            if timeout "$timeout_s" git clone --branch gallery-data --single-branch --depth 1 "$REMOTE_URL" /tmp/gallery-backup 2>/tmp/gallery-clone.log; then
              ok=1
              break
            fi
            if grep -qi "not found in upstream\|couldn.t find remote ref\|remote branch gallery-data not found" /tmp/gallery-clone.log; then
              not_found=1
              break
            fi
            echo "Fallo al clonar el respaldo (intento $attempt/3, tope ${timeout_s}s), reintentando..."
            cat /tmp/gallery-clone.log || true
            sleep 15
          done

          if [ -n "$ok" ]; then
            echo "Rama de respaldo permanente encontrada, restaurando..."
            if [ -d /tmp/gallery-backup/storage ]; then
              cp -a /tmp/gallery-backup/storage/. storage/
              # Los archivos de más de 95MB se trocean en partes de <100MB antes de cada checkpoint
              # (git rechaza cualquier archivo de más de 100MB) — aquí se reensamblan enteros otra
              # vez antes de que la app los use. Antes esos vídeos simplemente se excluían del
              # respaldo y se perdían para siempre en cuanto la sesión se reiniciaba, aunque fueran
              # el vídeo fuente de un trabajo subido a mano (sin enlace para volver a descargarlo) —
              # el caso normal de este canal, no una excepción.
              find storage -type f -name "*.part0000" -print | while read -r first; do
                orig="${first%.part0000}"
                echo "Reensamblando '$orig' desde sus partes..."
                cat "${orig}".part* > "$orig"
                rm -f "${orig}".part*
              done
              echo "Restaurado en storage/: $(du -sh storage 2>/dev/null | cut -f1)"
            else
              echo "La rama de respaldo existe pero todavía no tiene ninguna carpeta storage/ guardada."
            fi
          elif [ -n "$not_found" ]; then
            echo "Confirmado (mensaje exacto de git): todavía no existe la rama de respaldo 'gallery-data' — primera vez de verdad que arranca este mecanismo."
            mkdir -p /tmp/gallery-backup
            cd /tmp/gallery-backup
            git init -q -b gallery-data
            git remote add origin "$REMOTE_URL"
          else
            echo "::error::No se pudo clonar la rama de respaldo tras 3 intentos, y NO es porque la rama no exista (mensaje de git distinto a 'not found'). Puede ser un fallo de red temporal. Se para aquí a propósito para no arriesgar arrancar con la galería vacía y sobrescribir un respaldo real."
            cat /tmp/gallery-clone.log || true
            exit 1
          fi

      - name: Diagnóstico — comprobar qué hay realmente en storage/ tras restaurar
        # Deja constancia en el log de qué hay EXACTAMENTE en storage/ justo después de restaurar
        # (paso de arriba), para poder confirmar de un vistazo si esta vez sí ha llegado algo.
        run: |
          echo "--- contenido de storage/ ---"
          ls -la storage/ 2>&1 || echo "(storage/ no existe)"
          echo "--- buscando app.db en todo el árbol ---"
          find storage -maxdepth 3 -iname "app.db*" -exec ls -la {} \; 2>&1 || true
          echo "--- espacio en disco ---"
          df -h . || true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar ffmpeg, yt-dlp y dependencias de Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip fonts-dejavu-core fonts-liberation fonts-comic-neue
          pip3 install --no-cache-dir --break-system-packages yt-dlp faster-whisper piper-tts librosa bgutil-ytdlp-pot-provider yt-dlp-invidious

      - name: Instalar fuentes libres para el editor de texto del clip
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/custom
          # Google Fonts (licencia OFL/Apache), directo del repo oficial: no todas están
          # empaquetadas para apt. "%5B"/"%5D" son "[" "]" codificados porque curl interpreta
          # corchetes sin codificar como un rango/glob, no como parte literal de la URL.
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/BebasNeue-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/bebasneue/BebasNeue-Regular.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Anton-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Montserrat-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Poppins-Bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Oswald-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/oswald/Oswald%5Bwght%5D.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/PermanentMarker-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/apache/permanentmarker/PermanentMarker-Regular.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Bangers-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/bangers/Bangers-Regular.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Lobster-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/lobster/Lobster-Regular.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/ArchivoBlack-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/archivoblack/ArchivoBlack-Regular.ttf"
          sudo curl -fsSL -o /usr/share/fonts/truetype/custom/Caveat-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/caveat/Caveat%5Bwght%5D.ttf"
          sudo fc-cache -f

      - name: Instalar el modelo de IA local de repuesto (Ollama) — nunca bloquea el arranque
        # Último eslabón de la cadena de proveedores de IA (ver src/lib/ai/ollama.ts): un modelo
        # abierto corriendo en este mismo servidor, sin clave, sin cuenta, sin tarjeta, sin cupo
        # que se pueda agotar — solo se usa si todos los proveedores en la nube fallan a la vez.
        # continue-on-error de verdad: si algo aquí falla (red bloqueada, instalador caído, lo que
        # sea), la sesión sigue exactamente igual que sin este paso — nunca puede romper el
        # arranque de la web/worker. La descarga del modelo se lanza en segundo plano (no se
        # espera aquí) para no restar tiempo a los pasos siguientes; con el tiempo que tardan
        # (fuentes, npm ci, imagen de Docker, compilar) suele terminar de sobra antes de que haga
        # falta de verdad.
        continue-on-error: true
        run: |
          set +e
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:11434 && break
            sleep 1
          done
          nohup sh -c 'ollama pull llama3.2:3b; ollama pull moondream' > ollama-pull.log 2>&1 &
          exit 0

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Iniciar el proveedor de tokens de YouTube (evita el bloqueo por IP de datacenter)
        run: |
          docker pull brainicism/bgutil-ytdlp-pot-provider
          docker run -d --init -p 4416:4416 --name bgutil-provider brainicism/bgutil-ytdlp-pot-provider
          ready=""
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:4416; then
              ready=1
              echo "Proveedor de tokens listo."
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "El proveedor de tokens no respondió a tiempo. Logs del contenedor:"
            docker logs bgutil-provider || true
            exit 1
          fi

      - name: Preparar la base de datos (reutilizando la del respaldo si existe)
        run: npx prisma generate && npx prisma db push
        env:
          DATABASE_URL: "file:${{ github.workspace }}/storage/app.db"

      - name: Compilar la web
        run: npm run build
        env:
          DATABASE_URL: "file:${{ github.workspace }}/storage/app.db"
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Arrancar la web y el worker en segundo plano
        run: |
          nohup npm run start > web.log 2>&1 &
          nohup npx tsx worker/index.ts > worker.log 2>&1 &
        env:
          DATABASE_URL: "file:${{ github.workspace }}/storage/app.db"
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          AI_PROVIDER: "groq"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Cadena de repuesto: si se ponen estos dos secretos (ambos con capa gratuita, ver
          # src/lib/ai/cerebras.ts y mistral.ts), se usan solos cuando Groq/Gemini se queden sin
          # cupo — no hace falta tocar nada más aquí, el orden lo decide FALLBACK_ORDER en
          # src/lib/ai/provider.ts.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # Último eslabón de repuesto: modelo local sin clave (ver el paso de arriba que lo
          # instala) — si por lo que sea no llegó a instalarse/descargarse a tiempo, una llamada
          # aquí simplemente falla y la cadena de proveedores sigue funcionando igual que sin él.
          OLLAMA_ENABLED: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Sin estos cuatro, config.google/config.tiktok se quedan vacíos y la web no puede
          # conectar YouTube/TikTok aunque el código de OAuth esté bien — hacían falta como
          # secretos de GitHub PERO nunca se pasaban aquí al proceso.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          # Confirmado con datos reales del propio log de una sesión completa ("df -h" tras
          # restaurar la galería): el runner de GitHub Actions da 145GB en total, de los que ~62GB
          # ya se van en cosas que no crecen durante la sesión (SO del runner, node_modules, Ollama,
          # whisper, ffmpeg...). De los ~83GB que quedan, cada GB de storage/ cuesta el DOBLE de
          # disco real mientras dura un checkpoint (la copia temporal de /tmp/gallery-backup duplica
          # su tamaño, ver el paso de guardado más abajo) — así que el límite de bloqueo es, como
          # mucho, la mitad de ese margen. Puesto en 30/35GB (el máximo razonable dejando ~13GB de
          # colchón para que no crezca hasta pegado al borde: caché de apt/npm, temporales de ffmpeg
          # durante un render pesado, objetos git acumulados en la propia rama de respaldo a lo largo
          # de la sesión). Ir más arriba sin colchón arriesga quedarse sin disco a media sesión — un
          # fallo mucho peor (puede tirar el proceso a medio render) que este aviso controlado.
          STORAGE_WARN_GB: "30"
          STORAGE_BLOCK_GB: "35"
          TRANSCRIPTION_PROVIDER: "local"
          PYTHON_PATH: "python3"
          TTS_PROVIDER: "local"
          ENABLE_COMMENTARY: "false"
          ENABLE_DYNAMIC_ZOOM: "true"
          ENABLE_HOOK_FRAME_CHECK: "true"
          ENABLE_BIG_CAPTIONS: "true"
          ENABLE_COVER_CARD: "true"
          CHANNEL_NAME: "Escenas Virales"
          CHANNEL_NICHE: "Recopilación de los momentos más divertidos, graciosos y de entretenimiento de creadores de contenido — humor, giros inesperados y reacciones, pensado para el público de comedia/entretenimiento de shorts"
          # Sin fijar CHANNEL_LANGUAGE aquí: se usa el valor por defecto de la app (inglés,
          # más ingresos publicitarios). Antes esto estaba fijado a "es" y anulaba en silencio
          # ese valor por defecto en todo momento.
          # La programación automática (franjas horarias) necesita saber la zona horaria real
          # para que "12:00-14:00" signifique la hora de España y no UTC.
          TZ: "Europe/Madrid"

      - name: Esperar a que la web responda
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000; then
              echo "Web lista."
              exit 0
            fi
            sleep 2
          done
          echo "La web no arrancó a tiempo, revisa web.log"
          cat web.log
          exit 1

      - name: Abrir el túnel público (Cloudflare, sin cuenta)
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:3000 > cloudflared.log 2>&1 &

          URL=""
          for i in $(seq 1 20); do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' cloudflared.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "No se pudo abrir el túnel."
            cat cloudflared.log
            exit 1
          fi

          echo "## 🔗 Tu panel está listo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**$URL**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Entra con la contraseña que pusiste en el secreto \`APP_PASSWORD\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Esta URL cambiará dentro de ~4h15min, cuando esta sesión pase el testigo a la siguiente." >> "$GITHUB_STEP_SUMMARY"
          echo "[cloudflared] URL pública: $URL"
          echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV"

      # URL fija y permanente (buenos-habitos-eta.vercel.app) que redirige siempre al túnel de
      # Cloudflare de la sesión activa (ver carpeta vercel-redirect/). El túnel cambia cada vez
      # que una sesión pasa el testigo a la siguiente, así que aquí actualizamos la variable de
      # entorno TUNNEL_URL del proyecto en Vercel vía su API y disparamos un redeploy (con un
      # "Deploy Hook", no hace falta el token para esa parte) para que el cambio surta efecto.
      # Si algo de esto falla (Vercel caído, secretos no configurados todavía...) NO debe tirar
      # abajo el servidor real: el paso se marca como "no crítico" y solo avisa.
      - name: Actualizar la URL permanente de Vercel
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: python3 scripts/update_vercel_tunnel.py

      # A partir de aquí: el ÚNICO guardado real de la galería. Cada 10 minutos se hace un commit
      # de verdad con el contenido actual de storage/ (base de datos + vídeos) a la rama de git
      # "gallery-data" — nunca caduca, nunca se desaloja por peso, sobrevive a que esta sesión
      # temporal termine, se cancele o se caiga por cualquier motivo (como mucho se pierden los
      # últimos 10 minutos de shorts generados, no la sesión entera). Ya NO se usa
      # "actions/cache" para esto — motivo completo en el primer paso de este archivo.
      #
      # BUG REAL CONFIRMADO Y CORREGIDO (sesión temporal 97, con logs reales): el job entero tiene
      # un tope DURO de 360 minutos (timeout-minutes de este workflow) que GitHub Actions mata sin
      # avisar si se supera — y si eso pasa ANTES de llegar al último paso ("Pasar el testigo"),
      # nadie relanza la siguiente sesión: el servidor se queda caído del todo hasta que alguien
      # lo note y lo arranque a mano. Con 33 checkpoints de 10 min (330 min) más el arranque
      # (~4 min) solo quedaban ~26 min de margen — y una sola operación de red (git push/fetch)
      # que se quede colgada sin límite propio basta para comerse ese margen y hacer que el job
      # entero muera a mitad de un checkpoint, justo lo que pasó. Arreglo doble: (1) bajado a 30
      # checkpoints (300 min) para dejar ~55 min de margen real antes del tope de 360, y (2) cada
      # operación de red de git en los checkpoints lleva ahora su propio "timeout" (nunca puede
      # colgarse sin límite, como mucho falla rápido y el reintento con backoff ya existente se
      # encarga del resto).
      #
      # SEGUNDO BUG REAL CONFIRMADO Y CORREGIDO (mismo día, con logs reales): el "timeout 120" del
      # paso de restaurar (arriba) se quedaba corto en cuanto la rama de respaldo creció a varios
      # GB — el clon se mataba por tiempo (git solo llega a imprimir "Cloning into...", sin ningún
      # error de "rama no encontrada") y el script, incapaz de distinguir "se agotó el tiempo" de
      # "la rama no existe todavía", tomaba el camino de "primera vez" y arrancaba con storage/
      # VACÍO en TODAS las sesiones desde que se desplegó este mecanismo — perdiendo en la
      # práctica toda la galería y la cola en cada reinicio, aunque los datos siguieran a salvo en
      # la rama. Arreglo: más tiempo e intentos en el paso de restaurar, y solo se trata como "la
      # rama no existe de verdad" el mensaje exacto de git para eso — cualquier otro fallo para el
      # job entero en vez de arrancar en silencio con la galería vacía. Bajado a 25 checkpoints
      # (250 min) para compensar el margen que se lleva el restaurar con reintentos en el peor caso.
      #
      # TERCER BUG REAL CONFIRMADO Y CORREGIDO (el más grave, mismo día): DATABASE_URL usaba una
      # ruta RELATIVA ("file:./storage/app.db"). Prisma (tanto "prisma db push" como el cliente en
      # tiempo de ejecución que usa la web/worker) resuelve una ruta "file:" relativa contra la
      # carpeta de prisma/schema.prisma, NO contra el directorio de trabajo — así que la base de
      # datos REAL de toda la app llevaba desde siempre en "prisma/storage/app.db", una ruta que
      # este respaldo NUNCA ha tocado (solo respalda "storage/", no "prisma/storage/"). Confirmado
      # probando el cliente de Prisma directamente en local: con ruta relativa el archivo aparece
      # en prisma/storage/app.db (con todas las tablas y datos reales); con ruta ABSOLUTA aparece
      # correctamente en storage/app.db. Esto explica TODO lo visto hasta ahora — por qué nunca se
      # ha logrado restaurar galería/cola de una sesión a la siguiente, con este mecanismo o con el
      # anterior basado en caché — porque nunca se estaba respaldando el archivo real. Arreglo:
      # DATABASE_URL ahora usa una ruta absoluta ("file:${{ github.workspace }}/storage/app.db") en
      # los tres pasos que la usan, para que coincida de verdad con lo que este mecanismo respalda.
      #
      # CUARTO BUG REAL CONFIRMADO Y CORREGIDO (mismo día): los vídeos fuente de más de 95MB
      # (git rechaza cualquier archivo de más de 100MB) simplemente se EXCLUÍAN del respaldo, así
      # que se perdían para siempre en cuanto la sesión se reiniciaba. Para un trabajo con enlace
      # (YouTube, etc.) esto ya no importa — resolveSourceVideo() lo vuelve a descargar solo si
      # falta (ver src/lib/pipeline/download.ts). Pero para un trabajo SUBIDO A MANO (sin enlace de
      # origen, el caso normal de este canal, no una excepción) no hay ningún sitio del que volver
      # a descargarlo: se perdía sin remedio, con casi todos los trabajos acabando en error justo
      # después de cada reinicio automático. Arreglo: en vez de excluir el archivo grande del
      # checkpoint, se trocea en partes de 90MB (bajo el límite de git) que sí se pueden respaldar
      # normalmente, y se reensamblan enteras (byte a byte, verificado con sha256 en pruebas reales
      # antes de desplegarlo) justo después de restaurar la rama de respaldo, antes de arrancar la
      # web/worker — ver el paso "Restaurar la galería..." arriba y el trocedo en cada checkpoint
      # de abajo.



      - name: Mantener la sesión activa (checkpoint 1/25 de la galería)
        run: sleep 600

