name: Servidor temporal

# Enciende la web de Estudia en un servidor temporal y abre una URL pública (Cloudflare, sin cuenta).
# La base de datos (vídeos, "visto", "me gusta" y claves de IA) se guarda cada 20 min en la rama
# git "study-data" y se restaura al arrancar, así no se pierde nada al reiniciar.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: estudia-server
  cancel-in-progress: false

jobs:
  server:
    if: ${{ vars.SERVER_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Restaurar la base de datos desde la rama "study-data"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p storage
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if timeout 180 git clone --branch study-data --single-branch --depth 1 "$REMOTE_URL" "$RUNNER_TEMP/backup" 2>"$RUNNER_TEMP/clone.log"; then
            cp -a "$RUNNER_TEMP/backup/storage/." storage/ && echo "Base de datos restaurada."
          elif grep -qi "not found in upstream\|couldn.t find remote ref\|remote branch study-data not found" "$RUNNER_TEMP/clone.log"; then
            echo "Primera vez: todavía no hay copia de seguridad."
          else
            cat "$RUNNER_TEMP/clone.log"
            echo "::error::No se pudo leer la copia de seguridad. Paro para no arrancar vacío y pisarla luego."
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar la voz natural (Kokoro, gratis). Si falla, la web usa la voz del navegador
        continue-on-error: true
        run: |
          pip3 install --break-system-packages kokoro-onnx soundfile
          mkdir -p models
          curl -fsSL -o models/kokoro-v1.0.int8.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx"
          curl -fsSL -o models/voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
          python3 -c "import soundfile; from kokoro_onnx import Kokoro; Kokoro('models/kokoro-v1.0.int8.onnx','models/voices-v1.0.bin'); print('Voz Kokoro lista')"

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar la base de datos y compilar la web
        run: |
          npx prisma generate
          npx prisma db push
          npm run build
        env:
          DATABASE_URL: "file:${{ github.workspace }}/storage/app.db"
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Arrancar la web en segundo plano
        run: nohup npm run start > web.log 2>&1 &
        env:
          DATABASE_URL: "file:${{ github.workspace }}/storage/app.db"
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Esperar a que la web responda
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3000; then echo "Web lista."; exit 0; fi
            sleep 2
          done
          echo "La web no arrancó a tiempo."; cat web.log; exit 1

      - name: Abrir el túnel público (Cloudflare, sin cuenta)
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:3000 > cloudflared.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' cloudflared.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$URL" ]; then echo "No se pudo abrir el túnel."; cat cloudflared.log; exit 1; fi
          {
            echo "## 🔗 Tu panel está listo"
            echo ""
            echo "**$URL**"
            echo ""
            echo "Entra con la contraseña del secreto \`APP_PASSWORD\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "URL pública: $URL"

      - name: Mantener activo y guardar la base de datos cada 20 min (unas 5 horas)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Estudia Bot"
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for cycle in $(seq 1 15); do
            sleep 1200
            rm -rf "$RUNNER_TEMP/save" && mkdir -p "$RUNNER_TEMP/save"
            cd "$RUNNER_TEMP/save"
            git init -q -b study-data
            git remote add origin "$REMOTE_URL"
            mkdir storage && cp -a "$GITHUB_WORKSPACE/storage/." storage/
            git add -A
            git commit -q -m "Copia de seguridad $(date -u +%FT%TZ)" || true
            git push -q -f origin study-data || echo "Aviso: no se pudo guardar esta vez, se reintenta en 20 min."
            cd "$GITHUB_WORKSPACE"
          done

      - name: Pasar el testigo a la siguiente sesión
        if: ${{ vars.SERVER_ENABLED != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run server.yml --ref ${{ github.ref_name }} || true
