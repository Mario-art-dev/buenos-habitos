<style>
:root{
  --bg: #0f1220;
  --bg-alt: #171b2e;
  --card: #1c2138;
  --card-2: #232948;
  --text: #f2f3f8;
  --muted: #9aa0b4;
  --accent: #6c8cff;
  --accent-2: #8f6cff;
  --good: #35d29a;
  --warn: #ffb020;
  --danger: #ff5c72;
  --border: #2b3153;
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
  --radius: 18px;
}

*{ box-sizing: border-box; }
.hidden{ display:none !important; }
html,body{ height:100%; }
body{
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: radial-gradient(1200px 800px at 50% -10%, #202750 0%, var(--bg) 55%);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

#app{ height:100%; }

/* ---------- Top bar ---------- */
.main-app{
  display:flex;
  flex-direction:column;
  height:100dvh;
  max-width: 560px;
  margin: 0 auto;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding: 16px 18px calc(10px + env(safe-area-inset-top,0px));
  padding-top: max(16px, env(safe-area-inset-top));
}
.brand{ font-weight:800; font-size:1.05rem; display:flex; align-items:center; gap:8px; }
.brand span{ background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.clock{ font-variant-numeric: tabular-nums; color: var(--muted); font-weight:600; }

.tab-content{
  flex:1;
  overflow-y:auto;
  padding: 0 16px calc(90px + env(safe-area-inset-bottom,0px));
  -webkit-overflow-scrolling: touch;
}

.tabbar{
  display:flex;
  border-top: 1px solid var(--border);
  background: rgba(20,23,42,0.9);
  backdrop-filter: blur(10px);
  position: fixed;
  bottom:0; left:0; right:0;
  max-width: 560px;
  margin: 0 auto;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab-btn{
  flex:1;
  background:none;
  border:none;
  color: var(--muted);
  padding: 10px 4px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size: 0.7rem;
  font-weight:600;
}
.tab-btn span{ font-size: 0.68rem; }
.tab-btn.active{ color: var(--text); }
.tab-btn.active::before{
  content:"";
}

/* ---------- Sections ---------- */
.section-title{
  font-size:0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin: 20px 2px 10px;
  font-weight:700;
}
.section-title:first-child{ margin-top: 14px; }

.card{
  background: linear-gradient(180deg, var(--card), var(--card-2));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

.empty-hint{
  color: var(--muted);
  font-size: 0.9rem;
  text-align:center;
  padding: 30px 10px;
  line-height:1.5;
}

/* task row */
.task-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--border);
}
.task-row:last-child{ border-bottom:none; }
.task-emoji{
  width:42px; height:42px;
  border-radius:12px;
  background: rgba(108,140,255,0.14);
  display:flex; align-items:center; justify-content:center;
  font-size:1.3rem;
  flex-shrink:0;
}
.task-main{ flex:1; min-width:0; }
.task-name{ font-weight:700; font-size:0.96rem; }
.task-meta{ color: var(--muted); font-size:0.78rem; margin-top:2px; }
.task-badges{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
.badge{
  font-size:0.66rem;
  font-weight:700;
  padding: 3px 8px;
  border-radius:20px;
  background: rgba(255,255,255,0.06);
  color: var(--muted);
}
.badge.due{ background: rgba(255,92,114,0.18); color: var(--danger); }
.badge.done{ background: rgba(53,210,154,0.18); color: var(--good); }
.badge.enforce{ background: rgba(255,176,32,0.16); color: var(--warn); }

.task-actions{ display:flex; gap:8px; flex-shrink:0; }
.chip-btn{
  border:none;
  background: rgba(255,255,255,0.07);
  color: var(--text);
  width:36px; height:36px;
  border-radius:10px;
  font-size:1rem;
}
.chip-btn.primary{ background: var(--accent); }

/* streak pill */
.streak-pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:0.72rem;
  font-weight:700;
  color: var(--warn);
}

/* buttons */
.btn{
  border:none;
  border-radius: 14px;
  padding: 14px 18px;
  font-weight:700;
  font-size:0.95rem;
  cursor:pointer;
  width:100%;
}
.btn-primary{ background: linear-gradient(90deg, var(--accent), var(--accent-2)); color:#fff; }
.btn-danger{ background: rgba(255,92,114,0.15); color: var(--danger); }
.fab{
  position: sticky;
  bottom: 0;
  width:100%;
  margin-top: 8px;
}

.icon-btn{
  background: rgba(255,255,255,0.06);
  border:none;
  color: var(--text);
  width:34px; height:34px;
  border-radius:10px;
  font-size:1rem;
}

/* event button big tap target */
.event-card{
  display:flex;
  align-items:center;
  gap:14px;
  padding: 16px;
}
.event-tap{
  flex:1;
  background: rgba(143,108,255,0.14);
  border: 1px solid rgba(143,108,255,0.3);
  border-radius:14px;
  padding: 14px;
  color: var(--text);
  font-weight:700;
  font-size: 0.95rem;
  text-align:left;
  display:flex;
  align-items:center;
  gap:12px;
}
.event-tap:active{ transform: scale(0.98); }
.event-last{ color: var(--muted); font-size:0.75rem; margin-top:4px; font-weight:500; }

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0;
  background: rgba(5,6,15,0.65);
  backdrop-filter: blur(4px);
  display:flex;
  align-items:flex-end;
  z-index: 500;
}
.modal-overlay.hidden{ display:none; }
.modal{
  background: var(--bg-alt);
  width:100%;
  max-width: 560px;
  margin: 0 auto;
  border-radius: 20px 20px 0 0;
  max-height: 90dvh;
  overflow-y:auto;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: slideUp 0.2s ease-out;
}
@keyframes slideUp{ from{ transform: translateY(30px); opacity:0; } to{ transform:none; opacity:1; } }
.modal-header{
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 18px 6px;
}
.modal-header h2{ margin:0; font-size:1.1rem; }
.modal-body{ padding: 10px 18px 24px; }

.field{ display:block; margin-bottom:14px; }
.field > span{ display:block; font-size:0.8rem; color: var(--muted); margin-bottom:6px; font-weight:600; }
.field > span small{ display:block; font-weight:400; color: var(--muted); font-size:0.72rem; margin-top:2px; }
.field input[type="text"],
.field input[type="time"],
.field input[type="number"],
.field select{
  width:100%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px;
  border-radius: 12px;
  font-size: 1rem;
}
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.field-switch{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.field-switch input{ width:44px; height:26px; flex-shrink:0; }

.type-fields.hidden{ display:none; }

.days-row{ display:flex; gap:6px; }
.day-chip{
  flex:1;
  padding:10px 0;
  border-radius:10px;
  border:1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-weight:700;
  font-size:0.8rem;
}
.day-chip.active{ background: var(--accent); color:#fff; border-color: var(--accent); }

.modal-actions{ margin-top: 8px; display:flex; gap:10px; }
.modal-actions .btn-danger{ flex: 0 0 auto; padding-left:16px; padding-right:16px; width:auto; }
.modal-actions .btn-primary{ flex:1; }

/* ---------- Lock screen ---------- */
.lock-screen{
  position:fixed; inset:0;
  z-index: 1000;
  background: radial-gradient(1200px 900px at 50% 0%, #3a1030 0%, #0b0a17 60%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 24px;
  animation: pulseBg 3s ease-in-out infinite;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
.lock-screen.hidden{ display:none; }
@keyframes pulseBg{
  0%,100%{ filter: brightness(1); }
  50%{ filter: brightness(1.12); }
}
.lock-content{
  max-width: 420px;
  width:100%;
  text-align:center;
}
.lock-icon{ font-size: 4rem; margin-bottom: 6px; animation: shake 1.4s ease-in-out infinite; }
@keyframes shake{
  0%,100%{ transform: rotate(0deg); }
  10%{ transform: rotate(-12deg); }
  20%{ transform: rotate(10deg); }
  30%{ transform: rotate(-8deg); }
  40%{ transform: rotate(6deg); }
  50%{ transform: rotate(0deg); }
}
.lock-eyebrow{
  color: var(--danger);
  font-weight:800;
  letter-spacing:0.08em;
  text-transform:uppercase;
  font-size:0.75rem;
  margin-bottom: 6px;
}
.lock-content h1{ font-size: 1.6rem; margin: 0 0 8px; }
.lock-subtitle{ color: var(--muted); margin: 0 0 18px; font-size:0.92rem; line-height:1.5; }
.lock-timer{ font-size:0.85rem; color: var(--warn); font-weight:700; margin-bottom: 18px; min-height: 1.2em; }

.lock-queue{ color: var(--muted); font-size:0.75rem; margin-bottom: 14px; }

.btn-complete{
  position:relative;
  width:100%;
  padding: 20px 16px;
  border-radius: 18px;
  border: 2px solid rgba(53,210,154,0.5);
  background: rgba(53,210,154,0.08);
  color: var(--good);
  font-weight:800;
  font-size:1rem;
  overflow:hidden;
  -webkit-user-select:none;
  user-select:none;
  touch-action: manipulation;
}
.btn-complete-fill{
  position:absolute;
  left:0; top:0; bottom:0;
  width:0%;
  background: linear-gradient(90deg, var(--good), #35d2c0);
  z-index:0;
  transition: width 0.05s linear;
}
.btn-complete-label{ position:relative; z-index:1; mix-blend-mode: normal; }
.btn-complete.filling .btn-complete-label{ color: #06231a; }

.lock-secondary-row{
  display:flex;
  justify-content:center;
  gap: 22px;
  margin-top: 16px;
}
.btn-link{
  background:none; border:none;
  color: var(--muted);
  font-size:0.82rem;
  font-weight:600;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.snooze-info{ color: var(--muted); font-size:0.72rem; margin-top:10px; min-height:1em; }
.lock-warning{
  margin-top:16px;
  color: var(--danger);
  font-weight:700;
  font-size:0.82rem;
  min-height: 1.4em;
}

/* progress bars */
.bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.bar-label{ width:70px; font-size:0.72rem; color: var(--muted); flex-shrink:0; }
.bar-track{ flex:1; height:10px; background: rgba(255,255,255,0.06); border-radius:8px; overflow:hidden; }
.bar-fill{ height:100%; background: linear-gradient(90deg, var(--accent), var(--good)); }
.bar-val{ width:34px; text-align:right; font-size:0.72rem; color: var(--muted); flex-shrink:0; }

.stat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom: 6px; }
.stat-box{ background: var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 8px; text-align:center; }
.stat-num{ font-size:1.5rem; font-weight:800; }
.stat-label{ font-size:0.68rem; color: var(--muted); margin-top:2px; }

.toast{
  position:fixed;
  left:50%; bottom: 100px;
  transform: translateX(-50%);
  background: #10131f;
  border:1px solid var(--border);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 12px;
  font-size:0.85rem;
  z-index: 2000;
  box-shadow: var(--shadow);
}
.toast.hidden{ display:none; }

.note-box{
  font-size:0.76rem;
  color: var(--muted);
  background: rgba(255,255,255,0.04);
  border: 1px dashed var(--border);
  padding: 10px 12px;
  border-radius: 12px;
  line-height:1.5;
  margin-top: 4px;
}

</style>
</head>
<body>

<div id="app">

  <!-- LOCK SCREEN (hidden by default) -->
  <div id="lockScreen" class="lock-screen hidden" role="alertdialog" aria-modal="true">
    <div class="lock-content">
      <div class="lock-icon" id="lockIcon">⏰</div>
      <div class="lock-eyebrow">Tarea pendiente</div>
      <h1 id="lockTaskName">Nombre de la tarea</h1>
      <p id="lockSubtitle" class="lock-subtitle">Completa esto para poder seguir usando el móvil.</p>
      <div id="lockTimer" class="lock-timer"></div>

      <div class="lock-queue" id="lockQueue"></div>

      <button id="btnComplete" class="btn btn-complete">
        <span class="btn-complete-fill" id="btnCompleteFill"></span>
        <span class="btn-complete-label">Mantén pulsado: Ya lo hice ✅</span>
      </button>

      <div class="lock-secondary-row">
        <button id="btnSnooze" class="btn-link">Posponer 5 min</button>
        <button id="btnMute" class="btn-link">🔊 Silenciar</button>
      </div>
      <div id="snoozeInfo" class="snooze-info"></div>
      <div class="lock-warning" id="lockWarning"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" class="main-app">
    <header class="topbar">
      <div class="brand">⏰ <span>Buenos Hábitos</span></div>
      <div class="clock" id="clockNow">--:--</div>
    </header>

    <main id="tabContent" class="tab-content"></main>

    <nav class="tabbar">
      <button class="tab-btn active" data-tab="hoy">🏠<span>Hoy</span></button>
      <button class="tab-btn" data-tab="tareas">✅<span>Tareas</span></button>
      <button class="tab-btn" data-tab="eventos">⚡<span>Eventos</span></button>
      <button class="tab-btn" data-tab="progreso">📈<span>Progreso</span></button>
    </nav>
  </div>

  <!-- MODAL: Add/Edit task -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Nueva tarea</h2>
        <button id="modalClose" class="icon-btn">✕</button>
      </div>
      <form id="taskForm" class="modal-body">
        <input type="hidden" id="taskId" />

        <label class="field">
          <span>Icono</span>
          <input type="text" id="taskIcon" maxlength="2" placeholder="💪" value="💪" />
        </label>

        <label class="field">
          <span>Nombre de la tarea</span>
          <input type="text" id="taskName" placeholder="Ir al gimnasio" required />
        </label>

        <label class="field">
          <span>Tipo de horario</span>
          <select id="taskType">
            <option value="fixed">Hora fija (ej. cada día a las 18:00)</option>
            <option value="window">Franja horaria (ej. entre 13:00 y 15:00)</option>
            <option value="event">Después de un evento (ej. 20 min después de comer)</option>
          </select>
        </label>

        <div id="fieldsFixed" class="type-fields">
          <label class="field">
            <span>Hora</span>
            <input type="time" id="taskTime" value="08:00" />
          </label>
        </div>

        <div id="fieldsWindow" class="type-fields hidden">
          <div class="field-row">
            <label class="field">
              <span>Desde</span>
              <input type="time" id="taskWindowStart" value="13:00" />
            </label>
            <label class="field">
              <span>Hasta</span>
              <input type="time" id="taskWindowEnd" value="15:00" />
            </label>
          </div>
        </div>

        <div id="fieldsEvent" class="type-fields hidden">
          <label class="field">
            <span>Evento que lo dispara</span>
            <select id="taskEventId"></select>
          </label>
          <label class="field">
            <span>Minutos después del evento</span>
            <input type="number" id="taskDelay" min="0" max="240" value="20" />
          </label>
        </div>

        <label class="field">
          <span>Días</span>
          <div class="days-row" id="daysRow">
            <button type="button" class="day-chip" data-day="1">L</button>
            <button type="button" class="day-chip" data-day="2">M</button>
            <button type="button" class="day-chip" data-day="3">X</button>
            <button type="button" class="day-chip" data-day="4">J</button>
            <button type="button" class="day-chip" data-day="5">V</button>
            <button type="button" class="day-chip" data-day="6">S</button>
            <button type="button" class="day-chip" data-day="0">D</button>
          </div>
        </label>

        <label class="field field-switch">
          <span>
            Bloquear el móvil hasta completarla
            <small>Si está desactivado, solo recibirás un recordatorio.</small>
          </span>
          <input type="checkbox" id="taskEnforce" checked />
        </label>

        <div class="modal-actions">
          <button type="button" id="taskDelete" class="btn btn-danger hidden">Eliminar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Add event -->
  <div id="eventModalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Nuevo evento</h2>
        <button id="eventModalClose" class="icon-btn">✕</button>
      </div>
      <form id="eventForm" class="modal-body">
        <label class="field">
          <span>Icono</span>
          <input type="text" id="eventIcon" maxlength="2" placeholder="🍽️" value="🍽️" />
        </label>
        <label class="field">
          <span>Nombre del evento</span>
          <input type="text" id="eventName" placeholder="Acabo de comer" required />
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script>
(() => {
  'use strict';

  /* ---------------------------------------------------------------
   * Storage & state
   * ------------------------------------------------------------- */
  const STORAGE_KEY = 'bh_state_v1';
  const DAY_NAMES = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
  const SNOOZE_LIMIT = 3;
  const SNOOZE_MINUTES = 5;
  const HOLD_MS = 1200;

  function uid() {
    return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }

  function defaultState() {
    const gymId = uid();
    const eatEventId = uid();
    return {
      settings: { muted: false, onboardingSeen: false },
      events: [
        { id: eatEventId, icon: '🍽️', name: 'Acabo de comer', lastTriggeredAt: null }
      ],
      tasks: [
        {
          id: gymId, icon: '💪', name: 'Ir al gimnasio', type: 'fixed',
          time: '18:00', windowStart: '13:00', windowEnd: '15:00',
          eventId: eatEventId, delay: 20,
          days: [1, 2, 3, 4, 5], enforce: true,
          completions: {}, snoozedUntil: null, snoozeCount: {}
        },
        {
          id: uid(), icon: '🦷', name: 'Ponerme el Invisalign', type: 'event',
          time: '08:00', windowStart: '13:00', windowEnd: '15:00',
          eventId: eatEventId, delay: 20,
          days: [0, 1, 2, 3, 4, 5, 6], enforce: true,
          completions: {}, snoozedUntil: null, snoozeCount: {}
        },
        {
          id: uid(), icon: '💧', name: 'Beber un vaso de agua', type: 'window',
          time: '08:00', windowStart: '09:00', windowEnd: '11:00',
          eventId: eatEventId, delay: 20,
          days: [0, 1, 2, 3, 4, 5, 6], enforce: false,
          completions: {}, snoozedUntil: null, snoozeCount: {}
        }
      ]
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      if (!parsed.tasks || !parsed.events) return defaultState();
      return parsed;
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  let state = loadState();

  /* ---------------------------------------------------------------
   * Date/time helpers
   * ------------------------------------------------------------- */
  function pad2(n) { return String(n).padStart(2, '0'); }
  function todayKey(d = new Date()) {
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }
  function dateKeyDaysAgo(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return todayKey(d);
  }
  function timeStrToMinutes(str) {
    const [h, m] = str.split(':').map(Number);
    return h * 60 + m;
  }
  function fmtHM(date) {
    return `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
  }
  function fmtCountdown(ms) {
    if (ms <= 0) return '0:00';
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${m}:${pad2(s)}`;
  }
  function isActiveDay(task, date) {
    return task.days.includes(date.getDay());
  }
  function isStandalone() {
    return window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches ||
      window.matchMedia('(display-mode: fullscreen)').matches;
  }

  /* ---------------------------------------------------------------
   * Task due-state computation
   * ------------------------------------------------------------- */
  function computeDue(task, now) {
    const d = new Date(now);
    if (!isActiveDay(task, d)) return { status: 'inactive' };
    const key = todayKey(d);
    const doneToday = !!task.completions[key];
    const nowMin = d.getHours() * 60 + d.getMinutes();

    if (task.type === 'fixed') {
      const trigMin = timeStrToMinutes(task.time);
      if (doneToday) return { status: 'done' };
      if (nowMin < trigMin) return { status: 'upcoming', label: `Hoy a las ${task.time}` };
      if (task.snoozedUntil && now < task.snoozedUntil) return { status: 'snoozed', until: task.snoozedUntil };
      const trigDate = new Date(d); trigDate.setHours(Math.floor(trigMin / 60), trigMin % 60, 0, 0);
      return { status: 'due', sinceTs: trigDate.getTime() };
    }

    if (task.type === 'window') {
      const startMin = timeStrToMinutes(task.windowStart);
      const endMin = timeStrToMinutes(task.windowEnd);
      if (doneToday) return { status: 'done' };
      if (nowMin < startMin) return { status: 'upcoming', label: `Entre ${task.windowStart} y ${task.windowEnd}` };
      if (task.snoozedUntil && now < task.snoozedUntil) return { status: 'snoozed', until: task.snoozedUntil };
      const startDate = new Date(d); startDate.setHours(Math.floor(startMin / 60), startMin % 60, 0, 0);
      return { status: 'due', sinceTs: startDate.getTime(), overdue: nowMin > endMin };
    }

    if (task.type === 'event') {
      const ev = state.events.find(e => e.id === task.eventId);
      if (!ev || !ev.lastTriggeredAt) return { status: 'idle', label: `Se activa con "${ev ? ev.name : '?'}"` };
      const dueAt = ev.lastTriggeredAt + task.delay * 60000;
      const doneAfterTrigger = Object.values(task.completions).some(ts => ts >= ev.lastTriggeredAt);
      if (doneAfterTrigger) return { status: 'done' };
      if (now < dueAt) return { status: 'waiting', at: dueAt };
      if (task.snoozedUntil && now < task.snoozedUntil) return { status: 'snoozed', until: task.snoozedUntil };
      return { status: 'due', sinceTs: dueAt };
    }
    return { status: 'inactive' };
  }

  function markComplete(task, ts = Date.now()) {
    task.completions[todayKey(new Date(ts))] = ts;
    task.snoozedUntil = null;
    saveState();
  }

  function toggleQuickComplete(taskId) {
    const task = state.tasks.find(t => t.id === taskId);
    if (!task) return;
    const key = todayKey();
    if (task.completions[key]) {
      delete task.completions[key];
    } else {
      markComplete(task);
    }
    saveState();
    renderCurrentTab();
  }

  function getDueQueue(now) {
    const list = [];
    for (const t of state.tasks) {
      if (!t.enforce) continue;
      const info = computeDue(t, now);
      if (info.status === 'due') list.push({ task: t, info });
    }
    list.sort((a, b) => a.info.sinceTs - b.info.sinceTs);
    return list;
  }

  /* ---------------------------------------------------------------
   * Streaks / stats
   * ------------------------------------------------------------- */
  function streakFor(task) {
    let streak = 0;
    const d = new Date();
    for (let i = 0; i < 365; i++) {
      const key = todayKey(d);
      const active = isActiveDay(task, d);
      if (active) {
        if (task.completions[key]) {
          streak++;
        } else if (i === 0) {
          // today, not completed yet: don't break the streak, just don't count it
        } else {
          break;
        }
      }
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  function weekCompletion(task) {
    const arr = [];
    for (let i = 6; i >= 0; i--) {
      const key = dateKeyDaysAgo(i);
      const d = new Date();
      d.setDate(d.getDate() - i);
      arr.push({ key, active: isActiveDay(task, d), done: !!task.completions[key] });
    }
    return arr;
  }

  /* ---------------------------------------------------------------
   * Rendering
   * ------------------------------------------------------------- */
  const tabContent = document.getElementById('tabContent');
  let currentTab = 'hoy';

  function typeLabel(task) {
    if (task.type === 'fixed') return `⏰ ${task.time}`;
    if (task.type === 'window') return `🕒 ${task.windowStart}–${task.windowEnd}`;
    if (task.type === 'event') {
      const ev = state.events.find(e => e.id === task.eventId);
      return `⚡ ${task.delay} min tras "${ev ? ev.name : '?'}"`;
    }
    return '';
  }

  function daysLabel(task) {
    if (task.days.length === 7) return 'Todos los días';
    return task.days.slice().sort((a,b)=>{
      const order = [1,2,3,4,5,6,0];
      return order.indexOf(a) - order.indexOf(b);
    }).map(d => DAY_NAMES[d]).join(' ');
  }

  function badgeForStatus(info) {
    switch (info.status) {
      case 'due': return `<span class="badge due">${info.overdue ? 'Atrasada' : 'PENDIENTE AHORA'}</span>`;
      case 'snoozed': return `<span class="badge due">Pospuesta</span>`;
      case 'done': return `<span class="badge done">Hecha ✓</span>`;
      case 'waiting': return `<span class="badge">En ${fmtCountdown(info.at - Date.now())}</span>`;
      case 'upcoming': return `<span class="badge">${info.label}</span>`;
      case 'idle': return `<span class="badge">Esperando evento</span>`;
      default: return `<span class="badge">Inactiva hoy</span>`;
    }
  }

  function renderHoy() {
    const now = Date.now();
    const rows = state.tasks.map(t => ({ t, info: computeDue(t, now) }));

    let html = '';
    if (!isStandalone()) {
      html += `
        <div class="note-box" style="border-color:#ffb020;">
          📲 <strong>Añádela a tu pantalla de inicio</strong> para el bloqueo más fuerte posible:
          toca <strong>Compartir → Añadir a pantalla de inicio</strong> y ábrela siempre desde ahí
          (no desde Safari). Así se abre sin barra de navegador y no puedes deslizar hacia atrás
          para saltarte la pantalla de bloqueo.
        </div>`;
    }
    if (!state.settings.onboardingSeen) {
      html += `
        <div class="note-box" id="onboardingNote">
          💡 <strong>Límite real en iPhone:</strong> ninguna web ni app de terceros puede impedir
          que cambies de app o apagues la pantalla; eso solo lo controla Apple. Esta pantalla te
          bloquea mientras la tengas abierta y te avisa si intentas salir. Para un bloqueo más
          serio, combínala con el Acceso Guiado o Tiempo en pantalla de iOS (mira las instrucciones
          más abajo). <button class="btn-link" id="dismissOnboarding" style="margin-left:4px;">Entendido</button>
        </div>`;
    }

    html += `<div class="section-title">Hoy · ${new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}</div>`;

    if (rows.length === 0) {
      html += `<div class="empty-hint">Aún no tienes tareas. Ve a la pestaña "Tareas" para crear tu primera alarma.</div>`;
    } else {
      html += `<div class="card">`;
      rows
        .sort((a, b) => (a.info.status === 'due' ? -1 : 1) - (b.info.status === 'due' ? -1 : 1))
        .forEach(({ t, info }) => {
          const doneToday = !!t.completions[todayKey()];
          html += `
          <div class="task-row">
            <div class="task-emoji">${t.icon}</div>
            <div class="task-main">
              <div class="task-name">${escapeHtml(t.name)}</div>
              <div class="task-meta">${typeLabel(t)} · ${daysLabel(t)}</div>
              <div class="task-badges">
                ${badgeForStatus(info)}
                ${t.enforce ? '<span class="badge enforce">🔒 Bloquea</span>' : ''}
              </div>
            </div>
            <div class="task-actions">
              <button class="chip-btn ${doneToday ? 'primary' : ''}" data-action="quick-toggle" data-id="${t.id}" title="Marcar hecho">${doneToday ? '✓' : '☐'}</button>
            </div>
          </div>`;
        });
      html += `</div>`;
    }

    tabContent.innerHTML = html;

    const dismiss = document.getElementById('dismissOnboarding');
    if (dismiss) dismiss.addEventListener('click', () => {
      state.settings.onboardingSeen = true;
      saveState();
      renderCurrentTab();
    });
    tabContent.querySelectorAll('[data-action="quick-toggle"]').forEach(btn => {
      btn.addEventListener('click', () => toggleQuickComplete(btn.dataset.id));
    });
  }

  function renderTareas() {
    let html = `<div class="section-title">Tus tareas</div>`;
    if (state.tasks.length === 0) {
      html += `<div class="empty-hint">No hay tareas todavía.</div>`;
    } else {
      html += `<div class="card">`;
      state.tasks.forEach(t => {
        const streak = streakFor(t);
        html += `
        <div class="task-row" data-action="edit-task" data-id="${t.id}" style="cursor:pointer;">
          <div class="task-emoji">${t.icon}</div>
          <div class="task-main">
            <div class="task-name">${escapeHtml(t.name)}</div>
            <div class="task-meta">${typeLabel(t)} · ${daysLabel(t)}</div>
            <div class="task-badges">
              ${t.enforce ? '<span class="badge enforce">🔒 Bloquea</span>' : '<span class="badge">🔔 Solo recuerda</span>'}
              ${streak > 0 ? `<span class="streak-pill">🔥 ${streak}</span>` : ''}
            </div>
          </div>
          <div class="task-actions">
            <button class="chip-btn" data-action="edit-task" data-id="${t.id}">✏️</button>
          </div>
        </div>`;
      });
      html += `</div>`;
    }
    html += `<button class="btn btn-primary fab" id="btnNewTask">+ Nueva tarea</button>`;
    tabContent.innerHTML = html;

    tabContent.querySelectorAll('[data-action="edit-task"]').forEach(el => {
      el.addEventListener('click', () => openTaskModal(el.dataset.id));
    });
    document.getElementById('btnNewTask').addEventListener('click', () => openTaskModal(null));
  }

  function renderEventos() {
    let html = `<div class="section-title">Eventos</div>
      <div class="note-box">Un evento es algo que ocurre a una hora que no sabes de antemano
      (como "comer"). Púlsalo en el momento y las tareas vinculadas se activarán X minutos después.</div>`;

    state.events.forEach(ev => {
      const linked = state.tasks.filter(t => t.type === 'event' && t.eventId === ev.id);
      const lastStr = ev.lastTriggeredAt
        ? `Última vez: hoy a las ${fmtHM(new Date(ev.lastTriggeredAt))}`
        : 'Todavía no lo has marcado hoy';
      html += `
        <div class="card event-card">
          <button class="event-tap" data-action="trigger-event" data-id="${ev.id}">
            <span style="font-size:1.4rem;">${ev.icon}</span>
            <span>
              ${escapeHtml(ev.name)}
              <div class="event-last">${lastStr}${linked.length ? ` · ${linked.length} tarea(s) vinculada(s)` : ''}</div>
            </span>
          </button>
        </div>`;
    });

    html += `<button class="btn btn-primary fab" id="btnNewEvent">+ Nuevo evento</button>`;
    tabContent.innerHTML = html;

    tabContent.querySelectorAll('[data-action="trigger-event"]').forEach(btn => {
      btn.addEventListener('click', () => triggerEvent(btn.dataset.id));
    });
    document.getElementById('btnNewEvent').addEventListener('click', () => openEventModal());
  }

  function renderProgreso() {
    const totalCompletionsWeek = state.tasks.reduce((sum, t) => {
      return sum + weekCompletion(t).filter(d => d.done).length;
    }, 0);
    const bestStreak = state.tasks.reduce((max, t) => Math.max(max, streakFor(t)), 0);
    const activeTasks = state.tasks.length;

    let html = `<div class="section-title">Tu progreso</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-num">${totalCompletionsWeek}</div><div class="stat-label">Hechas esta semana</div></div>
        <div class="stat-box"><div class="stat-num">🔥${bestStreak}</div><div class="stat-label">Mejor racha</div></div>
        <div class="stat-box"><div class="stat-num">${activeTasks}</div><div class="stat-label">Tareas activas</div></div>
      </div>
      <div class="section-title">Últimos 7 días</div>
      <div class="card">`;

    if (state.tasks.length === 0) {
      html += `<div class="empty-hint">Crea tareas para ver tu progreso aquí.</div>`;
    } else {
      state.tasks.forEach(t => {
        const week = weekCompletion(t);
        const doneCount = week.filter(d => d.done).length;
        const activeCount = week.filter(d => d.active).length || 1;
        const pct = Math.round((doneCount / activeCount) * 100);
        html += `
          <div class="bar-row">
            <div class="bar-label">${t.icon} ${escapeHtml(truncate(t.name, 10))}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="bar-val">${doneCount}/${activeCount}</div>
          </div>`;
      });
    }
    html += `</div>`;
    tabContent.innerHTML = html;
  }

  function truncate(str, n) { return str.length > n ? str.slice(0, n - 1) + '…' : str; }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
  }

  function renderCurrentTab() {
    if (currentTab === 'hoy') renderHoy();
    else if (currentTab === 'tareas') renderTareas();
    else if (currentTab === 'eventos') renderEventos();
    else if (currentTab === 'progreso') renderProgreso();
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      renderCurrentTab();
    });
  });

  /* ---------------------------------------------------------------
   * Event trigger
   * ------------------------------------------------------------- */
  function triggerEvent(eventId) {
    const ev = state.events.find(e => e.id === eventId);
    if (!ev) return;
    ev.lastTriggeredAt = Date.now();
    saveState();
    renderCurrentTab();
    showToast(`"${ev.name}" registrado a las ${fmtHM(new Date())}`);
    tick();
  }

  /* ---------------------------------------------------------------
   * Task modal (add/edit)
   * ------------------------------------------------------------- */
  const modalOverlay = document.getElementById('modalOverlay');
  const taskForm = document.getElementById('taskForm');
  const taskType = document.getElementById('taskType');
  const fieldsFixed = document.getElementById('fieldsFixed');
  const fieldsWindow = document.getElementById('fieldsWindow');
  const fieldsEvent = document.getElementById('fieldsEvent');
  const taskEventId = document.getElementById('taskEventId');
  const taskDeleteBtn = document.getElementById('taskDelete');
  let selectedDays = new Set([0, 1, 2, 3, 4, 5, 6]);

  function refreshTypeFields() {
    const v = taskType.value;
    fieldsFixed.classList.toggle('hidden', v !== 'fixed');
    fieldsWindow.classList.toggle('hidden', v !== 'window');
    fieldsEvent.classList.toggle('hidden', v !== 'event');
  }
  taskType.addEventListener('change', refreshTypeFields);

  document.getElementById('daysRow').addEventListener('click', (e) => {
    const chip = e.target.closest('.day-chip');
    if (!chip) return;
    const d = Number(chip.dataset.day);
    if (selectedDays.has(d)) selectedDays.delete(d); else selectedDays.add(d);
    chip.classList.toggle('active');
  });

  function populateEventSelect() {
    taskEventId.innerHTML = state.events.map(e => `<option value="${e.id}">${e.icon} ${escapeHtml(e.name)}</option>`).join('');
  }

  function openTaskModal(taskId) {
    populateEventSelect();
    const task = taskId ? state.tasks.find(t => t.id === taskId) : null;
    document.getElementById('modalTitle').textContent = task ? 'Editar tarea' : 'Nueva tarea';
    document.getElementById('taskId').value = task ? task.id : '';
    document.getElementById('taskIcon').value = task ? task.icon : '✅';
    document.getElementById('taskName').value = task ? task.name : '';
    taskType.value = task ? task.type : 'fixed';
    document.getElementById('taskTime').value = task ? task.time : '08:00';
    document.getElementById('taskWindowStart').value = task ? task.windowStart : '13:00';
    document.getElementById('taskWindowEnd').value = task ? task.windowEnd : '15:00';
    document.getElementById('taskDelay').value = task ? task.delay : 20;
    if (task && task.eventId) taskEventId.value = task.eventId;
    document.getElementById('taskEnforce').checked = task ? task.enforce : true;
    taskDeleteBtn.classList.toggle('hidden', !task);

    selectedDays = new Set(task ? task.days : [0, 1, 2, 3, 4, 5, 6]);
    document.querySelectorAll('#daysRow .day-chip').forEach(chip => {
      chip.classList.toggle('active', selectedDays.has(Number(chip.dataset.day)));
    });

    refreshTypeFields();
    modalOverlay.classList.remove('hidden');
  }

  function closeTaskModal() { modalOverlay.classList.add('hidden'); }
  document.getElementById('modalClose').addEventListener('click', closeTaskModal);
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeTaskModal(); });

  taskForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = document.getElementById('taskId').value;
    if (selectedDays.size === 0) { showToast('Selecciona al menos un día'); return; }
    const data = {
      icon: document.getElementById('taskIcon').value.trim() || '✅',
      name: document.getElementById('taskName').value.trim(),
      type: taskType.value,
      time: document.getElementById('taskTime').value,
      windowStart: document.getElementById('taskWindowStart').value,
      windowEnd: document.getElementById('taskWindowEnd').value,
      eventId: taskEventId.value,
      delay: Number(document.getElementById('taskDelay').value) || 0,
      days: Array.from(selectedDays),
      enforce: document.getElementById('taskEnforce').checked
    };
    if (!data.name) return;

    if (id) {
      const task = state.tasks.find(t => t.id === id);
      Object.assign(task, data);
    } else {
      state.tasks.push({ id: uid(), completions: {}, snoozedUntil: null, snoozeCount: {}, ...data });
    }
    saveState();
    closeTaskModal();
    renderCurrentTab();
  });

  taskDeleteBtn.addEventListener('click', () => {
    const id = document.getElementById('taskId').value;
    if (!id) return;
    if (!confirm('¿Eliminar esta tarea?')) return;
    state.tasks = state.tasks.filter(t => t.id !== id);
    saveState();
    closeTaskModal();
    renderCurrentTab();
  });

   * Event modal (add)
   * ------------------------------------------------------------- */

  /* ---------------------------------------------------------------
   * Toast

  /* ---------------------------------------------------------------
   * Lock screen
   * ------------------------------------------------------------- */
  const lockScreen = document.getElementById('lockScreen');
  const lockIcon = document.getElementById('lockIcon');
  const lockTaskName = document.getElementById('lockTaskName');
  const lockSubtitle = document.getElementById('lockSubtitle');
  const lockTimer = document.getElementById('lockTimer');
  const lockQueueEl = document.getElementById('lockQueue');
  const btnComplete = document.getElementById('btnComplete');
  const btnCompleteFill = document.getElementById('btnCompleteFill');
  const btnSnooze = document.getElementById('btnSnooze');
  const btnMute = document.getElementById('btnMute');
  const snoozeInfo = document.getElementById('snoozeInfo');
  const lockWarning = document.getElementById('lockWarning');

  let lockedTaskId = null;
  let escapeAttempts = 0;
  let wakeLock = null;

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { /* battery saver or unsupported, ignore */ }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  function isLockOpen() { return !lockScreen.classList.contains('hidden'); }

  function openLock(task) {
    lockedTaskId = task.id;
    lockIcon.textContent = task.icon;
    lockTaskName.textContent = task.name;
    lockSubtitle.textContent = task.type === 'event'
      ? 'Ha pasado el tiempo previsto tras el evento. Complétala para poder seguir usando el móvil.'
      : 'Es la hora. Complétala para poder seguir usando el móvil.';
    lockWarning.textContent = '';
    escapeAttempts = 0;
    updateSnoozeUI(task);
    lockScreen.classList.remove('hidden');
    tryEnterFullscreen();
    startAlarmSound();
    requestWakeLock();
    if (navigator.vibrate) navigator.vibrate([120, 60, 120, 60, 200]);
  }

  function closeLock() {
    lockedTaskId = null;
    lockScreen.classList.add('hidden');
    stopAlarmSound();
    releaseWakeLock();
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
  }

  function updateSnoozeUI(task) {
    const used = task.snoozeCount[todayKey()] || 0;
    const remaining = SNOOZE_LIMIT - used;
    btnSnooze.style.display = remaining > 0 ? 'inline' : 'none';
    snoozeInfo.textContent = remaining > 0
      ? `Te quedan ${remaining} aplazamiento(s) de ${SNOOZE_MINUTES} min hoy.`
      : 'Ya no puedes posponer más esta tarea hoy.';
  }

  function updateLockScreenLive() {
    if (!lockedTaskId) return;
    const task = state.tasks.find(t => t.id === lockedTaskId);
    if (!task) { closeLock(); return; }
    const now = Date.now();
    const info = computeDue(task, now);
    if (info.status === 'due' && info.sinceTs) {
      lockTimer.textContent = `Llevas ${fmtCountdown(now - info.sinceTs)} esperando`;
    } else {
      lockTimer.textContent = '';
    }
    const queue = getDueQueue(now);
    if (queue.length > 1) {
      lockQueueEl.textContent = `+ ${queue.length - 1} tarea(s) más pendientes después de esta`;
    } else {
      lockQueueEl.textContent = '';
    }
  }

  function refreshLockDriver() {
    const now = Date.now();
    const queue = getDueQueue(now);

    if (queue.length === 0) {
      if (isLockOpen()) closeLock();
      return;
    }
    const top = queue[0].task;
    if (!isLockOpen()) {
      openLock(top);
    } else if (lockedTaskId !== top.id) {
      // current locked task got resolved/snoozed, move to next
      lockIcon.textContent = top.icon;
      lockTaskName.textContent = top.name;
      lockedTaskId = top.id;
      updateSnoozeUI(top);
    }
    updateLockScreenLive();
  }

  function completeLockedTask() {
    if (!lockedTaskId) return;
    const task = state.tasks.find(t => t.id === lockedTaskId);
    if (!task) return;
    markComplete(task);
    showToast(`"${task.name}" completada ✅`);
    resetHoldFill();
    refreshLockDriver();
    renderCurrentTab();
  }

  function snoozeLockedTask() {
    if (!lockedTaskId) return;
    const task = state.tasks.find(t => t.id === lockedTaskId);
    if (!task) return;
    const key = todayKey();
    const used = task.snoozeCount[key] || 0;
    if (used >= SNOOZE_LIMIT) return;
    task.snoozeCount[key] = used + 1;
    task.snoozedUntil = Date.now() + SNOOZE_MINUTES * 60000;
    saveState();
    refreshLockDriver();
    renderCurrentTab();
  }

  btnSnooze.addEventListener('click', snoozeLockedTask);
  btnMute.addEventListener('click', () => {
    state.settings.muted = !state.settings.muted;
    btnMute.textContent = state.settings.muted ? '🔇 Activar sonido' : '🔊 Silenciar';
    saveState();
    if (state.settings.muted) stopAlarmSound(); else startAlarmSound();
  });

  /* ---- hold-to-complete button ---- */
  let holdRAF = null, holdStart = null;
  function startHold() {
    if (holdRAF) return;
    btnComplete.classList.add('filling');
    holdStart = performance.now();
    const step = (t) => {
      const elapsed = t - holdStart;
      const pct = Math.min(100, (elapsed / HOLD_MS) * 100);
      btnCompleteFill.style.width = pct + '%';
      if (pct >= 100) {
        resetHoldFill();
        completeLockedTask();
        return;
      }
      holdRAF = requestAnimationFrame(step);
    };
    holdRAF = requestAnimationFrame(step);
  }
  function resetHoldFill() {
    if (holdRAF) cancelAnimationFrame(holdRAF);
    holdRAF = null;
    btnCompleteFill.style.width = '0%';
    btnComplete.classList.remove('filling');
  }
  ['pointerdown'].forEach(ev => btnComplete.addEventListener(ev, (e) => { e.preventDefault(); startHold(); }));
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btnComplete.addEventListener(ev, resetHoldFill));

  /* ---- fullscreen ---- */
  function tryEnterFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen && !document.fullscreenElement) {
      el.requestFullscreen().catch(() => {});
    }
  }
  document.body.addEventListener('click', tryEnterFullscreen, { once: true });

  /* ---- visibility nag ---- */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && lockedTaskId) {
      escapeAttempts++;
      lockWarning.textContent = escapeAttempts === 1
        ? 'Has vuelto a la app. La tarea sigue pendiente.'
        : `Sigues sin completarla (intento #${escapeAttempts} de salir).`;
      if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
      tryEnterFullscreen();
      requestWakeLock();
    }
  });
  window.addEventListener('beforeunload', (e) => {
    if (lockedTaskId) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  /* ---- alarm sound ---- */
  let audioCtx = null;
  let alarmInterval = null;
  function beep() {
    if (state.settings.muted) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = 880;
      gain.gain.value = 0.05;
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
    } catch (e) { /* audio not available yet, ignore */ }
  }
  function startAlarmSound() {
    stopAlarmSound();
    beep();
    alarmInterval = setInterval(beep, 900);
  }
  function stopAlarmSound() {
    if (alarmInterval) clearInterval(alarmInterval);
    alarmInterval = null;
  }

  /* ---------------------------------------------------------------
   * Main loop
   * ------------------------------------------------------------- */
  const clockNow = document.getElementById('clockNow');
  function tick() {
    clockNow.textContent = fmtHM(new Date());
    refreshLockDriver();
  }

  let renderCounter = 0;
  setInterval(() => {
    tick();
    renderCounter++;
    if (renderCounter % 2 === 0) renderCurrentTab();
  }, 1000);

  /* ---------------------------------------------------------------
   * Init
   * ------------------------------------------------------------- */
  btnMute.textContent = state.settings.muted ? '🔇 Activar sonido' : '🔊 Silenciar';
  renderCurrentTab();
  tick();
})();

</script>
</body>
</html>
