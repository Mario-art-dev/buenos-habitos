services:
  # Genera tokens de origen para que yt-dlp no sea bloqueado por YouTube al descargar desde la
  # IP del servidor (bloqueo "Sign in to confirm you're not a bot" típico de IPs de datacenter).
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - app_storage:/app/storage
    restart: unless-stopped
    depends_on:
      - migrate
      - bgutil-provider

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    volumes:
      - app_storage:/app/storage
    restart: unless-stopped
    depends_on:
      - migrate
      - bgutil-provider

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - app_storage:/app/storage
    command: ["npx", "prisma", "db", "push"]

volumes:
  app_storage:
